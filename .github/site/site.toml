[[faq]]
q = "How do I install the Bing Webmaster MCP server?"
a = "Run BING_WM_ALLOW_WRITES=false uvx bing-webmaster-ai-cli-mcp to start the stdio MCP server, with an API key from Bing Webmaster Tools (Settings, API Access) in BING_WM_API_KEY. pip install bing-webmaster-ai-cli-mcp (Python 3.12+) also puts the bing-wm CLI on PATH."

[[faq]]
q = "Can the agent change my Bing account?"
a = "Not by default. Without BING_WM_ALLOW_WRITES=true the server lists no tool that changes Bing: write tools only record a plan, and a human applies it at the CLI with bing-wm plan apply. No MCP tool takes a plan ID in either mode."

[[faq]]
q = "Which AI clients does it work with?"
a = "Any MCP client over stdio. The README has configs for Claude Code, Claude Desktop, Cursor, Windsurf and Zed; Claude Code and the bing-wm CLI are verified on the maintainer's host, the others are documented only."

[[faq]]
q = "Does IndexNow work with Google?"
a = "No. Google does not participate in IndexNow. The IndexNow registry lists Bing, Yandex, Seznam, Naver, Yep, Internet Archive and Amazonbot, and submission through api.indexnow.org fans out to participating engines."

[[faq]]
q = "How do I check if Bing has indexed my page?"
a = "Run bing-wm index url example.com https://example.com/page. Over MCP the bing_url_info tool reads the same data; HttpStatus 0 there means Bing reports no status, not 200."

[[faq]]
q = "Which parts of the Bing Webmaster API are covered?"
a = "The Microsoft interface has 62 methods: 59 are supported and three obsolete deep-link methods are excluded. Only the JSON API is used; SOAP, POX, the Bing Search API, Google Search Console and GA4 are out of scope."
