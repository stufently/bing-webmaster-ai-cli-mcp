name: MCPB

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  mcpb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1, the same pin as ci.yml and release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check tag matches package version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          PY
      - name: Build the Desktop Extension
        run: bash scripts/build-mcpb.sh
      - name: Attach the bundle to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "Desktop Extension (.mcpb) for Claude Desktop."
          fi
          shopt -s nullglob
          files=(dist-mcpb/*.mcpb)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no .mcpb bundle to upload" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
