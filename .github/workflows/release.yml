name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PIP_CONSTRAINT: constraints.txt

jobs:
  publish:
    # Off until the PyPI Trusted Publisher is configured: set the repository
    # variable PYPI_PUBLISH=true to enable. The GitHub Release and the .mcpb
    # come from mcpb.yml and do not depend on this job.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout v7.0.1, verified from the official repository on 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0, verified from the official repository on 2026-08-25.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          PY
      - run: python -m pip install --constraint constraints.txt ".[test]" build
      - run: make lint
      - run: make test
      - run: python scripts/smoke_mcp.py
      - run: python -m build
      # pypa/gh-action-pypi-publish v1.9.0, verified from the official repository on 2026-08-25.
      - uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0
