name: MCP Registry

# Lists the PyPI package in the official MCP registry
# (registry.modelcontextprotocol.io) under io.github.stufently/bing-webmaster-ai-cli-mcp.
#
# No stored secret is involved: the registry trusts a short-lived OIDC token
# minted for this workflow for every name under io.github.stufently/*. It checks
# ownership by reading the `mcp-name` marker in the README that PyPI shows, so
# this run waits until release.yml has put the tagged version on PyPI.
#
# A version the registry already lists is skipped, so a re-run does not fail.
# A new version needs `version` bumped in pyproject.toml and server.json together.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: registry
  cancel-in-progress: false

env:
  PACKAGE: bing-webmaster-ai-cli-mcp
  SERVER_NAME: io.github.stufently/bing-webmaster-ai-cli-mcp
  PUBLISHER_VERSION: "1.8.1"
  PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, verified from the official repository on 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check versions agree
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          fail=0
          [ "$(jq -r '.version' server.json)" = "$version" ] || { echo "::error::server.json version != pyproject $version"; fail=1; }
          [ "$(jq -r '.packages[0].version' server.json)" = "$version" ] || { echo "::error::server.json package version != pyproject $version"; fail=1; }
          [ "$(jq -r '.packages[0].identifier' server.json)" = "$PACKAGE" ] || { echo "::error::server.json identifier is not $PACKAGE"; fail=1; }
          [ "$(jq -r '.name' server.json)" = "$SERVER_NAME" ] || { echo "::error::server.json name is not $SERVER_NAME"; fail=1; }
          grep -qF "<!-- mcp-name: $SERVER_NAME -->" README.md || { echo "::error::README lacks the mcp-name marker"; fail=1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"; fail=1
          fi
          [ "$fail" = 0 ]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the registry
        id: listed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://registry.modelcontextprotocol.io/v0/servers/${SERVER_NAME/\//%2F}/versions/$VERSION"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
          case "$code" in
            200) echo "listed=true" >> "$GITHUB_OUTPUT"; echo "$SERVER_NAME $VERSION is already listed" ;;
            404) echo "listed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::registry answered $code for $url"; exit 1 ;;
          esac

      - name: Wait for the version on PyPI
        if: steps.listed.outputs.listed == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://pypi.org/pypi/$PACKAGE/$VERSION/json"
          for _ in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
            [ "$code" = 200 ] && exit 0
            [ "$code" = 404 ] || echo "PyPI answered $code"
            sleep 30
          done
          echo "::error::$PACKAGE $VERSION did not appear on PyPI within 20 minutes"
          exit 1

      - name: Install mcp-publisher
        if: steps.listed.outputs.listed == 'false'
        run: |
          url="https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o publisher.tar.gz "$url"
          echo "${PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher

      - name: Publish to the MCP registry
        if: steps.listed.outputs.listed == 'false'
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
