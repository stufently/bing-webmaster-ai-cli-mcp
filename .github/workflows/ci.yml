name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: constraints.txt

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, verified from the official repository on 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0, verified from the official repository on 2026-08-25.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --constraint constraints.txt ".[test]"
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --constraint constraints.txt ".[test]"
      - run: make test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --constraint constraints.txt ".[test]"
      - run: python scripts/smoke_mcp.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build --tag bing-webmaster-ai-cli-mcp:test .
      - name: Assert the image does not run as root
        run: test "$(docker run --rm --entrypoint id bing-webmaster-ai-cli-mcp:test -u)" != "0"
